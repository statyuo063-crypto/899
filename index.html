<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHANTOM | Official Gaming Portal</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: rgba(18, 24, 38, 0.95);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.4);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(16, 185, 129, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }

        .container { width: 100%; max-width: 420px; padding: 20px; text-align: center; }

        .card {
            background: var(--panel-bg); border: 1px solid var(--border);
            border-radius: 24px; padding: 30px 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px); position: relative;
        }

        .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: 2px; color: #fff; margin-bottom: 5px; }
        .sub-logo { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }

        /* CIRCLE CONNECT BUTTON SIMULATOR */
        .connect-wrapper { position: relative; width: 160px; height: 160px; margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .connect-btn {
            width: 140px; height: 140px; border-radius: 50%;
            background: radial-gradient(circle, #1f293d 0%, #111827 100%);
            border: 3px solid var(--success);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 0 25px var(--success-glow); transition: all 0.3s ease;
        }
        .connect-btn:active { transform: scale(0.95); }
        .connect-btn.connected { border-color: var(--success); box-shadow: 0 0 40px var(--success); background: radial-gradient(circle, #065f46 0%, #064e3b 100%); }
        
        .status-text { font-size: 0.95rem; font-weight: bold; color: var(--success); margin-top: 5px; }
        .ping-text { font-size: 0.8rem; color: #cbd5e1; margin-top: 2px; }

        .node-info {
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px; text-align: left;
        }
        .node-title { font-size: 0.85rem; font-weight: bold; color: #fff; }
        .node-sub { font-size: 0.7rem; color: var(--text-dim); }

        .btn-action {
            width: 100%; padding: 14px; background: linear-gradient(135deg, var(--success), #059669);
            border: none; border-radius: 12px; color: white; font-weight: bold; font-size: 0.9rem;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 15px var(--success-glow); transition: all 0.3s;
        }
        .btn-action:hover { opacity: 0.9; transform: translateY(-1px); }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="logo">PHANTOM.LOL</div>
            <div class="sub-logo">Official Gaming Tunnel</div>

            <div class="node-info">
                <div>
                    <div class="node-title">🇨🇬 PHANTOM-6927</div>
                    <div class="node-sub">139.59.237.237 • Hysteria2</div>
                </div>
                <div style="color: var(--success); font-size: 1.2rem;">⚡</div>
            </div>

            <!-- ปุ่มจำลองการเชื่อมต่อแบบต้นฉบับ -->
            <div class="connect-wrapper" onclick="triggerConnect()">
                <div class="connect-btn" id="main-circle">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
                    <div class="status-text" id="status-label">Connect</div>
                    <div class="ping-text" id="ping-label">70 ms</div>
                </div>
            </div>

            <button class="btn-action" onclick="importToHiddify()">⚡ เปิดและเชื่อมต่อผ่าน Hiddify</button>
        </div>
    </div>

    <script>
        // ชุดคอนฟิกต้นฉบับแท้
        const phantomConfig = "hysteria2://phantom-gaming-2026@139.59.237.237:443?insecure=1&sni=gateway.phantom.lol#PHANTOM-6927";

        function importToHiddify() {
            navigator.clipboard.writeText(phantomConfig).catch(() => {});
            window.location.href = `hiddify://import/${encodeURIComponent(phantomConfig)}`;
            
            // เปลี่ยนสถานะหน้าเว็บให้จำลองการเชื่อมติดสีเขียว
            const circle = document.getElementById('main-circle');
            const status = document.getElementById('status-label');
            circle.classList.add('connected');
            status.innerText = "Connected";
        }

        function triggerConnect() {
            importToHiddify();
        }
    </script>
</body>
</html>
